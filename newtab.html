<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая вкладка</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="search-shell">
      <nav class="shortcut-grid" aria-label="Быстрые ссылки"></nav>
      <form class="search" action="https://yandex.ru/search/" method="get" role="search">
        <input
          class="search__input"
          type="search"
          name="text"
          aria-label="Поиск в Яндексе"
          aria-controls="search-history"
          aria-expanded="false"
          autocomplete="off"
        >
        <button class="search__button" type="submit" aria-label="Найти"></button>
      </form>
      <div class="search-history" id="search-history" aria-label="История поиска" hidden></div>
      <form
        class="gpt-search"
        action="https://chatgpt.com/"
        method="get"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Временный чат ChatGPT"
      >
        <input type="hidden" name="temporary-chat" value="true">
        <input
          class="gpt-search__input"
          type="text"
          name="q"
          aria-label="Сообщение для ChatGPT"
          autocomplete="off"
          required
        >
        <button class="gpt-search__button" type="submit" aria-label="Отправить в ChatGPT">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 15V5M6 9l4-4 4 4"></path>
          </svg>
        </button>
      </form>
    </div>
    <dialog class="shortcut-dialog" aria-labelledby="shortcut-dialog-title">
      <form class="shortcut-form" method="dialog">
        <h2 id="shortcut-dialog-title">Добавить ссылку</h2>
        <div class="shortcut-field">
          <span>Название</span>
          <input
            type="text"
            name="title"
            maxlength="24"
            autocomplete="off"
            required
            aria-autocomplete="list"
            aria-controls="shortcut-title-suggestions"
            aria-expanded="false"
          >
          <div class="shortcut-suggestions" id="shortcut-title-suggestions" hidden></div>
        </div>
        <div class="shortcut-field">
          <span>Ссылка</span>
          <input
            class="shortcut-url-input"
            type="text"
            name="url"
            placeholder="https://example.com"
            maxlength="2048"
            autocomplete="off"
            spellcheck="false"
            required
            aria-autocomplete="list"
            aria-controls="shortcut-suggestions"
            aria-expanded="false"
          >
          <div class="shortcut-suggestions" id="shortcut-suggestions" hidden></div>
        </div>
        <div class="shortcut-dialog__actions">
          <button class="shortcut-dialog__cancel" type="button">Отмена</button>
          <button class="shortcut-dialog__submit" type="submit">Добавить</button>
        </div>
      </form>
    </dialog>
    <script src="newtab.js"></script>
  </body>
</html>
