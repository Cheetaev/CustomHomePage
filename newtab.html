<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая вкладка</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="search-shell">
      <form class="search" action="https://yandex.ru/search/" method="get" role="search">
        <input
          class="search__input"
          type="search"
          name="text"
          placeholder="Поиск в Яндексе"
          aria-label="Поиск в Яндексе"
          aria-controls="search-history"
          aria-expanded="false"
          autocomplete="off"
        >
        <button class="search__button" type="submit">Найти</button>
      </form>
      <div class="search-history" id="search-history" aria-label="История поиска" hidden>
        <button class="search-history__item" type="button"></button>
      </div>
      <form
        class="gpt-search"
        action="https://chatgpt.com/"
        method="get"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Временный чат ChatGPT"
      >
        <input type="hidden" name="temporary-chat" value="true">
        <input
          class="gpt-search__input"
          type="text"
          name="q"
          placeholder="Спросить ChatGPT"
          aria-label="Сообщение для ChatGPT"
          autocomplete="off"
          required
        >
        <button class="gpt-search__button" type="submit" aria-label="Отправить в ChatGPT">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 15V5M6 9l4-4 4 4"></path>
          </svg>
        </button>
      </form>
    </div>
    <script src="newtab.js"></script>
  </body>
</html>
